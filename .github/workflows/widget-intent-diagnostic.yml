name: Diagnose widget intent registration
on:
  push:
    branches: [diagnostic/widget-intent-ios27]
permissions:
  contents: read
jobs:
  registration:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Run registration test on iOS 27
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          device="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices=json.load(sys.stdin)["devices"]; phones=[d for runtime, group in sorted(devices.items(), reverse=True) if ".iOS-27-" in runtime for d in group if d["name"].startswith("iPhone")]; print(next((d for d in phones if "Pro Max" in d["name"]), phones[0])["udid"])')"
          xcodebuild -project LifeFlow.xcodeproj -scheme LifeFlow -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -only-testing:LifeFlowUITests/WidgetIntentRegistrationTests/testSystemCanRunWidgetCompletionIntent \
            -derivedDataPath build/simulator test
