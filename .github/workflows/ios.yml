name: Build unsigned LifeFlow IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Test and build unsigned device IPA
        run: bash scripts/build-unsigned.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LifeFlow-unsigned
          path: artifacts/LifeFlow-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload IPA with widget
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: LifeFlow-widget
          path: artifacts/LifeFlow-widget.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Run iPhone simulator UI tests
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          device="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices=json.load(sys.stdin)["devices"]; phones=[d for runtime, group in sorted(devices.items(), reverse=True) if ".iOS-" in runtime for d in group if d["name"].startswith("iPhone")]; print(next((d for d in phones if "Pro Max" in d["name"]), phones[0])["udid"])')"
          xcodebuild -project LifeFlow.xcodeproj -scheme LifeFlow -configuration Debug \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -derivedDataPath build/simulator test
